# Hạ tầng cho lập trình trên máy: Postgres + MinIO.
# Chạy: npm run infra   (hoặc docker compose -f infra/docker/docker-compose.dev.yml up -d)
# Sau đó: npm run dev:backend và npm run dev:frontend
name: 4sigmabrains-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: workspace
      POSTGRES_PASSWORD: workspace
      POSTGRES_DB: workspace
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workspace"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]

volumes:
  postgres-data:
  minio-data:
